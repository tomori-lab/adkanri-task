<!DOCTYPE html>
<html lang="ja"><!-- closed: AXAD統合により受付終了 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アド管理タスク（受付終了）</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta http-equiv="refresh" content="8;url=https://axad.jp/dashboard/help?from=adkanri">
<style>
  :root { --bg: #0f172a; --surface: #1e293b; --border: #475569; --text: #f1f5f9; --text2: #94a3b8; --accent: #3b82f6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', -apple-system, 'Hiragino Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .box { text-align: center; padding: 56px 48px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; max-width: 480px; width: 92%; }
  .logo { font-size: 40px; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  p { color: var(--text2); line-height: 1.8; margin-bottom: 8px; }
  .cta { display: inline-block; margin-top: 20px; padding: 12px 28px; background: var(--accent); color: #fff; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 15px; }
  .note { margin-top: 20px; font-size: 12px; color: var(--text2); }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">📦➡️</div>
    <h1>アド管理依頼フォームはAXADに統合されました</h1>
    <p>このフォームでの新規受付は終了しました。</p>
    <p>アカウント・権限・招待系とキャップ通知は <b>AXADのよくある依頼フォーム</b>、<br>それ以外の依頼は <b>AXAD右下のチャット</b> からお願いします。</p>
    <a class="cta" href="https://axad.jp/dashboard/help?from=adkanri">AXADの依頼ページを開く</a>
    <p class="note">8秒後に自動で移動します。移動しない場合は上のボタンを押してください。</p>
  </div>
</body>
</html>
